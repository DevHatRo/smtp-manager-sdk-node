name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # No inputs: release-please reads release-please-config.json and
      # .release-please-manifest.json (manifest mode), which is what makes
      # `extra-files` bump src/version.ts alongside package.json.
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The release PR is opened with GITHUB_TOKEN, and events raised by that token do not
      # trigger other workflows, so the CI workflow never ran on it. Re-run the gates here
      # before anything reaches npm.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

      - run: pnpm build

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/index.d.cts

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
